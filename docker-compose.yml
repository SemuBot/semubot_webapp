services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ROSBRIDGE_HOST: ${ROSBRIDGE_HOST}
      ROSBRIDGE_PORT: ${ROSBRIDGE_PORT}
      SEMUBOT_PROFILE_FILE: /config/profile.yaml
    volumes:
      # Robot profile (semubot_bringup config/profiles); without SEMUBOT_PROFILE_FILE the app runs on its defaults
      - ${SEMUBOT_PROFILE_FILE:-/dev/null}:/config/profile.yaml:ro

# Run: docker compose up -d
# if there are changes in code or docker files run: docker compose down
# and then: docker compose up --build